# E2E override — prod frontend (runner stage) for Playwright tests.
services:
  # The tests drive http://localhost:3000. A .env written for a real domain
  # (ALLOWED_ORIGINS=["https://jaot.io"]) made the API refuse the Live Solve
  # socket from that origin with a bare 403, so every E2E solve fell back to
  # polling and nothing tested the live progress panel. FRONTEND_URL is the
  # origin the API also trusts, and the base of every link it emails.
  api:
    environment:
      - ALLOWED_ORIGINS=["http://localhost:3000"]
      - FRONTEND_URL=http://localhost:3000
  celery_worker:
    environment:
      - FRONTEND_URL=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8001
    # !reset clears base tmpfs (/app/.next:size=512m); only /tmp here so runner's baked .next is preserved.
    tmpfs: !reset
      - /tmp:size=64m
    depends_on:
      api:
        condition: service_healthy
