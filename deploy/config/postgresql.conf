# PostgreSQL production tuning
# Allocated ~2.5GB RAM to PostgreSQL (container memory limit, see docker-compose.prod.yml)
# Source: PostgreSQL documentation + PGTune recommendations

# Connection settings
max_connections = 100
listen_addresses = '*'

# Memory settings — sized for the 2.5GB container cap.
# shared_buffers ~25% of the cap; effective_cache_size ~70% (a planner hint covering
# shared_buffers + OS page cache within the cgroup). work_mem stays conservative because
# it is per-sort/hash and can multiply across the 100 connection slots.
shared_buffers = 640MB
work_mem = 8MB
effective_cache_size = 1792MB
maintenance_work_mem = 128MB

# WAL settings
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
# WAL archiving OFF (2026-07-07 incident): the cp-based archive_command silently
# failed for weeks (root-owned dir), pg_wal grew to 46.9G and filled the disk.
# Without a base backup a WAL archive is only a short forensic window anyway —
# recovery strategy is the daily pg_dump (deploy/backup.sh), not PITR. The
# emergency ALTER SYSTEM in postgresql.auto.conf overrides these at runtime;
# this makes the fix permanent for fresh volumes too.
archive_mode = off
#archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
#archive_timeout = 300

# Logging (UTC, DDL + slow queries for security audit trail)
log_timezone = 'UTC'
log_statement = 'ddl'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
