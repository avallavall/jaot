# Public CI — lint + tests on every PR and push to main.
#
# This is the contributor-facing pipeline: it runs on a plain GitHub runner
# with no secrets. Deploys are handled separately by the maintainer's
# self-hosted deploy workflow (.github/workflows/deploy.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned, not ">=": a floating version means a ruff release can turn the
      # gate red without anyone touching the code. 0.16.3 did exactly that on
      # 2026-08-14. Bump this together with .pre-commit-config.yaml.
      - run: pip install "ruff==0.16.3"
      # The gate covers the same directories as the pre-commit hook. infra/ joined
      # on 2026-08-13 with 87 warnings. scripts/, deploy/ and tests/ were checked
      # by pre-commit only, and a hook can be skipped.
      - run: ruff check app/ infra/ scripts/ deploy/ tests/
      - run: ruff format --check app/ infra/ scripts/ deploy/ tests/
      # The 7 domain boundary contracts. They ran in pre-commit only, and a hook
      # can be skipped — so README.md and docs/ARCHITECTURE/OVERVIEW.md both
      # claimed a CI gate that did not exist. Same version bound as the hook.
      # No app dependencies needed: grimp builds the import graph by parsing the
      # source, it never executes an import. Measured: 690 files, 3644 edges,
      # identical result with and without requirements.txt installed.
      - run: pip install "import-linter>=2.1"
      - run: lint-imports

  # Supply-chain + static security gates. These existed in the Woodpecker pipeline
  # and were lost in the migration to GitHub Actions — nobody deleted them on
  # purpose, they simply did not come across, and app/CLAUDE.md kept claiming CI
  # ran them (backend audit 2026-07-26, F-03 / D-11).
  security-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      # Declared production dependencies (and their transitives). Clean as of
      # 2026-07-26, so this gate is strict: any NEW advisory fails the build.
      - name: pip-audit (production dependencies)
        run: pip-audit -r requirements.txt --progress-spinner off
      # HIGH severity only. Bandit reports 5 medium / 31 low today — mostly
      # f-string SQL over hardcoded table names in migration backfills — so
      # gating at medium would fail on day one and teach everyone to ignore it.
      # Raise to -ll once those are triaged.
      - name: bandit (high severity)
        run: bandit -r app/ -lll

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jaot
          POSTGRES_PASSWORD: jaot
          POSTGRES_DB: jaot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://jaot:jaot@localhost:5432/jaot_test"
      TEST_DATABASE_URL: "postgresql://jaot:jaot@localhost:5432/jaot_test"
      REDIS_URL: ""
      CELERY_BROKER_URL: ""
      DEBUG: "True"
      JWT_SECRET: "ci-test-secret-not-for-production-use"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the command-line solvers
        # CBC and GLPK are programs, not Python packages, so pip cannot bring
        # them in. Their contract tests run the real binaries — without this
        # step they would skip, and a skipped solver test proves nothing.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coinor-cbc glpk-utils
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: >-
          pytest tests/
          -p no:xdist
          --cov=app
          --cov-fail-under=78
          --cov-report=term-missing
          --tb=short

  # The frontend's API types are generated from the backend's OpenAPI schema and
  # committed. Nothing verified them, and the only thing that regenerated them was
  # `npm run build`'s prebuild step, which curls http://localhost:8001 and prints
  # "API not running, skipping type generation" when nothing answers. Three
  # outcomes, two of them wrong: nothing running means the drift stays; an OLD API
  # container running means correct types are silently overwritten with old ones.
  # The Docker image build can never reach the API, so production ships whatever
  # is committed — and `tsc` then validates the frontend against a stale contract,
  # passing clean while the two sides disagree.
  #
  # `scripts/export_openapi.py` calls `app.openapi()` directly, so this needs no
  # running server and no database (measured: it exports all 194 paths with the
  # database unreachable). `info.version` does not reach api.ts, so a release
  # bump does not churn this file.
  types-frontend:
    runs-on: ubuntu-latest
    env:
      # Never connected to. `create_engine` only has to parse it at import time.
      DATABASE_URL: "postgresql://jaot:jaot@127.0.0.1:5432/jaot"
      REDIS_URL: ""
      CELERY_BROKER_URL: ""
      DEBUG: "True"
      JWT_SECRET: "ci-types-secret-not-for-production-use"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - name: Export the OpenAPI schema from the code
        run: python scripts/export_openapi.py
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline
        working-directory: frontend
      - run: npm run generate-types
        working-directory: frontend
      - name: The committed API types must match the schema
        run: |
          if ! git diff --exit-code -- frontend/src/lib/generated/api.ts; then
            echo "::error::frontend/src/lib/generated/api.ts is out of date with the backend schema."
            echo "Regenerate it: python scripts/export_openapi.py && (cd frontend && npm run generate-types)"
            exit 1
          fi

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run lint
      - run: npm run check-i18n
      # Blocking at CRITICAL, not HIGH, and that is a deliberate call: today there
      # are 4 high advisories in the PRODUCTION tree, all transitive through Next
      # (postcss, sharp) plus js-yaml/brace-expansion, and npm's only offered "fix"
      # is a downgrade to next@9.3.3. Gating at high would fail every build for
      # something we cannot fix without breaking the app — the fastest way to
      # teach a team to ignore a red pipeline. Critical blocks; high is printed
      # below so it stays visible and gets re-checked when Next ships an update.
      - name: npm audit (critical blocks)
        run: npm audit --audit-level=critical
      - name: npm audit (high — informational)
        run: npm audit --audit-level=high || true

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run test
