category: sports
category_display_name: Sports & Recreation

templates:
  - id: tournament_scheduling
    name: Tournament Scheduling Optimizer
    display_name: Tournament Scheduling
    short_description: Draw a single round-robin fixture list, choosing every host so the visiting clubs travel less.
    description: >
      Every team plays every other team once. The model picks the matchday for
      each fixture and decides which of the two clubs hosts it. The visiting
      club pays for the coach, and clubs do not pay the same rate per
      kilometre, so hosting is worth money and the schedule shares it out: each
      club hosts as near half its games as an odd count allows, and no club
      plays more away games in a row than the league permits. The answer is a
      fixture list with a matchday and a host for every game.
    category: sports
    tags: [sports, tournament, scheduling, fixtures, league]
    problem_type_tags: [MIP, scheduling]
    generator_type: round_robin
    generator_params: {}
    input_schema:
      type: object
      properties:
        teams:
          type: array
          description: Competing teams with their travel cost per kilometre
        distances:
          type: array
          description: Road distance between every pair of teams
        rounds:
          type: integer
          description: Matchdays available in the season
        max_consecutive_away:
          type: integer
          description: Longest run of away games a team may be given
      required: [teams, distances, rounds]
    input_fields:
      - name: teams
        label: Teams
        type: array
        description: "Teams with name, home city, and the cost of a kilometre on the road"
        required: true
        items:
          type: object
          properties:
            name: {type: string}
            city: {type: string}
            travel_cost_per_km: {type: number}
      - name: distances
        label: Distances
        type: array
        description: "Road distance in kilometres between each pair of teams"
        required: true
        items:
          type: object
          properties:
            from: {type: string}
            to: {type: string}
            km: {type: number}
      - name: rounds
        label: Matchdays
        type: integer
        description: "Matchdays in the season. Each one holds at most half as many games as there are teams"
        required: true
        minimum: 1
      - name: max_consecutive_away
        label: Longest Away Run
        type: integer
        description: "Most away games a team may be given in a row"
        required: false
        minimum: 1
    example_input:
      teams:
        - {name: "Girona Bruixes", city: "Girona", travel_cost_per_km: 2.4}
        - {name: "Manresa Roques", city: "Manresa", travel_cost_per_km: 2.1}
        - {name: "Lleida Ponent", city: "Lleida", travel_cost_per_km: 1.95}
        - {name: "Tarragona Mar", city: "Tarragona", travel_cost_per_km: 2.25}
        - {name: "Reus Ferro", city: "Reus", travel_cost_per_km: 1.8}
        - {name: "Vic Plana", city: "Vic", travel_cost_per_km: 2.55}
      distances:
        - {from: "Girona Bruixes", to: "Manresa Roques", km: 130}
        - {from: "Girona Bruixes", to: "Lleida Ponent", km: 225}
        - {from: "Girona Bruixes", to: "Tarragona Mar", km: 190}
        - {from: "Girona Bruixes", to: "Reus Ferro", km: 205}
        - {from: "Girona Bruixes", to: "Vic Plana", km: 85}
        - {from: "Manresa Roques", to: "Lleida Ponent", km: 125}
        - {from: "Manresa Roques", to: "Tarragona Mar", km: 130}
        - {from: "Manresa Roques", to: "Reus Ferro", km: 140}
        - {from: "Manresa Roques", to: "Vic Plana", km: 55}
        - {from: "Lleida Ponent", to: "Tarragona Mar", km: 95}
        - {from: "Lleida Ponent", to: "Reus Ferro", km: 85}
        - {from: "Lleida Ponent", to: "Vic Plana", km: 165}
        - {from: "Tarragona Mar", to: "Reus Ferro", km: 15}
        - {from: "Tarragona Mar", to: "Vic Plana", km: 165}
        - {from: "Reus Ferro", to: "Vic Plana", km: 175}
      rounds: 5
      max_consecutive_away: 2
    scenario_description: >
      A Catalan regional basketball league runs six clubs over five matchdays.
      Each club plays the other five once, so there are fifteen games and every
      matchday holds three of them. Coach hire costs each club a different
      amount per kilometre, from 1.80 at Reus to 2.55 at Vic, and the visiting
      club pays. Each club must host either two or three of its five games, and
      none may be sent away more than twice in a row.
    is_featured: true
    estimated_variables: 156
    estimated_constraints: 81

  - id: team_roster_optimization
    name: Team Roster Optimization
    display_name: Team Roster Optimization
    short_description: Select players for a team roster to maximize overall skill rating within salary cap and position constraints.
    description: >
      Build the best possible sports roster by selecting players from a pool, maximizing
      total team skill rating while staying under a salary cap. Each player has a
      position, a salary, and a skill rating. The solver ensures positional requirements
      are met (e.g., 2 guards, 3 forwards, 1 center) and the total salary does not
      exceed the cap. Useful for fantasy sports, draft planning, and squad management.
    scenario_description: >
      A fantasy basketball manager has a EUR 50,000 salary cap and must draft 8 players
      from a pool of 15 candidates. The team needs 2 guards, 3 forwards, 2 centers,
      and 1 utility player. Each player has a projected performance score and a salary.
      The goal is to maximise total projected points.
    category: sports
    tags: [sports, roster, fantasy, draft, salary-cap]
    problem_type_tags: [MIP]
    generator_type: knapsack
    generator_params: {}
    input_schema:
      type: object
      required: [capacity, items]
      properties:
        capacity: {type: number}
        items: {type: array}
    input_fields:
      - name: capacity
        label: Salary Cap
        type: number
        description: Maximum total salary budget
        required: true
        minimum: 1
        default: 50000
      - name: items
        label: Player Pool
        type: array
        description: Available players with projected points (value) and salary (weight)
        required: true
        items:
          type: object
          properties:
            name: {type: string}
            value: {type: number}
            weight: {type: number}
    example_input:
      capacity: 50000
      items:
        - {name: guard_star, value: 45, weight: 9000}
        - {name: guard_solid, value: 32, weight: 6000}
        - {name: guard_budget, value: 22, weight: 3500}
        - {name: forward_elite, value: 48, weight: 10000}
        - {name: forward_veteran, value: 35, weight: 7000}
        - {name: forward_young, value: 28, weight: 4500}
        - {name: forward_bench, value: 18, weight: 3000}
        - {name: center_dominant, value: 42, weight: 8500}
        - {name: center_reliable, value: 30, weight: 5500}
        - {name: center_rookie, value: 20, weight: 3000}
        - {name: utility_versatile, value: 25, weight: 4000}
        - {name: utility_specialist, value: 15, weight: 2500}
        - {name: guard_prospect, value: 12, weight: 2000}
        - {name: forward_depth, value: 14, weight: 2500}
        - {name: center_backup, value: 10, weight: 1500}
    is_featured: false
    estimated_variables: 15
    estimated_constraints: 1
